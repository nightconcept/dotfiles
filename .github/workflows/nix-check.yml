name: Nix Flake Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: linux
    container:
      image: nixos/nix:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Flake evaluation check
        run: |
          nix eval --json .#nixosConfigurations.vincent > /dev/null
          echo "✓ Flake evaluation successful"

      - name: List flake outputs
        run: nix flake show --json | head -c 500

      - name: Format check
        run: nix fmt -- .
