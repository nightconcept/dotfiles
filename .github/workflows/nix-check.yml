name: Nix Flake Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: linux
    container:
      image: nixos/nix:latest
      options: --user root
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Install Node (required by actions/checkout)
        run: |
          set -eux
          nix profile install nixpkgs#nodejs -L
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Flake eval
        run: nix flake eval --json > /dev/null

      - name: Format check
        run: nix fmt -- .
