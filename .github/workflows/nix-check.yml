name: Nix Flake Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: linux
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Flake check
        run: nix flake check

      - name: Format check
        run: nix fmt -- .
