[project]
name = "dotfiles-pyinfra"
version = "0.1.0"
description = "Declarative non-Nix host management with pyinfra"
dependencies = [
    "pyinfra>=3.0",
    "requests>=2.31.0",
]
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.30",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "D"]
ignore = ["D100", "D104"] # Ignore missing docstrings in public modules/packages for now

[tool.ruff.lint.pydocstyle]
convention = "google"
