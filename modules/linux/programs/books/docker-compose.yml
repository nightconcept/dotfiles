services:
  calibre:
    image: lscr.io/linuxserver/calibre:latest
    container_name: calibre
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - PASSWORD=calibre
    volumes:
      - /opt/books-stack/calibre:/config
      - /mnt/calibre-library:/library
      - /mnt/titan/Books:/Books
      - /mnt/titan/Books-Unorganized:/Books-Unorganized
    ports:
      - 8085:8080
      - 8181:8181
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - DOCKER_MODS=ghcr.io/linuxserver/mods:universal-calibre
    volumes:
      - /opt/books-stack/calibre-web:/config
      - /mnt/calibre-library:/books
    ports:
      - 8083:8083
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
