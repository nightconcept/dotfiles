services:
  paisa:
    image: ananthakumaran/paisa:latest-hledger
    container_name: paisa
    restart: unless-stopped
    ports:
      - "7500:7500"
    environment:
      PAISA_CONFIG: /root/Documents/paisa/paisa.yaml
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - ${PAISA_DATA_PATH}:/root/Documents/paisa
      - ${LEDGER_PATH}:/ledger
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:7500/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
