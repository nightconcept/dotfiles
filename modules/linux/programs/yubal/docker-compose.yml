name: yubal-test
services:
  yubal:
    image: ghcr.io/guillevc/yubal:latest
    container_name: yubal-test
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      PUID: "1000"
      PGID: "1000"
      YUBAL_TZ: America/Los_Angeles
      YUBAL_SCHEDULER_ENABLED: "false"
      YUBAL_DOWNLOAD_UGC: "false"
    volumes:
      - ${YUBAL_TEST_HOME:-/home/danny/.local/share/yubal-test}/data:/app/data
      - ${YUBAL_TEST_HOME:-/home/danny/.local/share/yubal-test}/config:/app/config
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"
