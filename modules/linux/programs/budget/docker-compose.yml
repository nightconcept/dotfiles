services:
  actual-budget:
    image: actualbudget/actual-server:latest
    container_name: actual-budget
    restart: unless-stopped
    ports:
      - "5006:5006"
    volumes:
      - ${ACTUAL_DATA_PATH}:/data
    healthcheck:
      test: ["CMD-SHELL", "node scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  paisa:
    image: ananthakumaran/paisa:latest-hledger
    container_name: paisa
    restart: unless-stopped
    ports:
      - "7500:7500"
    environment:
      PAISA_CONFIG: /root/Documents/paisa/paisa.yaml
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - ${PAISA_DATA_PATH}:/root/Documents/paisa
      - ${LEDGER_PATH}:/ledger:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:7500/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
