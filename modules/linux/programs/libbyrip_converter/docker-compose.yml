services:
  libbyrip-converter:
    build:
      context: ${LIBBYRIP_REPO}
      dockerfile: webapp/Dockerfile
    container_name: libbyrip-converter
    ports:
      - "${APP_PORT}:8080"
    volumes:
      - ${DATA_DIR}:/data
      - ${UPLOAD_DIR}:/data/uploads
      - ${OUTPUT_DIR}:/data/output
    restart: unless-stopped
