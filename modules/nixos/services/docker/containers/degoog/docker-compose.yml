services:
  degoog:
    container_name: degoog
    image: ghcr.io/degoog-org/degoog:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:4444:4444"
    volumes:
      - ./data:/app/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.degoog-lan.rule=Host(`search.local.solivan.dev`)"
      - "traefik.http.routers.degoog-lan.entrypoints=https"
      - "traefik.http.routers.degoog-lan.tls=true"
      - "traefik.http.routers.degoog-lan.middlewares=degoog-lan-only"
      - "traefik.http.middlewares.degoog-lan-only.ipallowlist.sourcerange=192.168.1.0/24"
      - "traefik.http.services.degoog.loadbalancer.server.port=4444"
      - "traefik.docker.network=proxy"
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"

networks:
  proxy:
    external: true
