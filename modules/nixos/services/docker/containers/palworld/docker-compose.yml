services:
  palworld-dedicated-server:
    container_name: palworld-dedicated-server
    image: jammsen/palworld-dedicated-server:latest
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - target: 8211 # Gameserver port inside of the container
        published: 8211 # Gameserver port on your host
        protocol: udp
        mode: host
      - target: 8212 # Gameserver REST API port inside of the container (required for backups/restarts/player detection since 1.0)
        published: 8212 # Gameserver REST API port on your host
        protocol: tcp
        mode: host
      - target: 25575 # RCON port inside of the container (game-level RCON only, no longer used by container tooling)
        published: 25575 # RCON port on your host
        protocol: tcp
        mode: host
    env_file:
      - ./default.env
    volumes:
      - ~/config/palworld:/palworld