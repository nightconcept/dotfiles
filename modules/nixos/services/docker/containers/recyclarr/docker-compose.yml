services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest  # no LTS policy; latest per policy
    container_name: recyclarr
    restart: always
    user: ${PUID}:${PGID}
    networks:
      - proxy
    environment:
      - TZ=${TZ}
      - CRON_SCHEDULE=${CRON_SCHEDULE}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - SONARR_ANIME_API_KEY=${SONARR_ANIME_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
    volumes:
      - type: bind
        source: ${CONFIG_PATH}
        target: /config
    privileged: false
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy:
    external: true
