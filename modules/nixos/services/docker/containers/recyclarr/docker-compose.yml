services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.8.0
    container_name: recyclarr
    restart: always
    user: ${PUID}:${PGID}
    networks:
      - proxy
    environment:
      - TZ=${TZ}
      - CRON_SCHEDULE=${CRON_SCHEDULE}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
    volumes:
      - type: bind
        source: ${CONFIG_PATH}
        target: /config
    privileged: false

networks:
  proxy:
    external: true
