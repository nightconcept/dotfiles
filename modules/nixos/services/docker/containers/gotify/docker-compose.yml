services:
  gotify:
    container_name: gotify
    image: gotify/server:3
    networks:
      - proxy
    ports:
      - "${LISTEN_ADDRESS}:${PORT}:80"
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
      - GOTIFY_DEFAULTUSER_NAME=${ADMIN_USERNAME}
      - GOTIFY_DEFAULTUSER_PASS_FILE=/run/secrets/admin-password
    volumes:
      - ${DATA_PATH}:/app/data
      - ${ADMIN_PASSWORD_FILE}:/run/secrets/admin-password:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy:
    external: true
