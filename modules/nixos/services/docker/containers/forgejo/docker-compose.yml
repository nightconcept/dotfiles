services:
  forgejo-db:
    image: postgres:16-alpine
    container_name: forgejo-db
    restart: always
    networks:
      - proxy
    volumes:
      - ${LOCAL_DB_PATH}:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=forgejo
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=forgejo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo -d forgejo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  forgejo:
    image: codeberg.org/forgejo/forgejo:11
    container_name: forgejo
    restart: always
    networks:
      - proxy
    depends_on:
      forgejo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ${REMOTE_DATA_PATH}:/data
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=forgejo-db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=${DB_PASSWORD}
      - FORGEJO__server__DOMAIN=${FORGEJO_DOMAIN:-forge.solivan.dev}
      - FORGEJO__server__SSH_DOMAIN=${FORGEJO_DOMAIN:-forge.solivan.dev}
      - FORGEJO__server__ROOT_URL=https://${FORGEJO_DOMAIN:-forge.solivan.dev}
      - FORGEJO__server__HTTP_PORT=${FORGEJO_HTTP_PORT:-3000}
      - FORGEJO__server__SSH_PORT=22
      - FORGEJO__actions__ENABLED=${FORGEJO_ACTIONS_ENABLED:-true}
      - FORGEJO__actions__DEFAULT_ACTIONS_URL=${FORGEJO_ACTIONS_URL:-https://github.com}
      - FORGEJO__repository.signing__FORMAT=ssh
      - FORGEJO__repository.signing__SIGNING_KEY=/data/git/.ssh/signing_key.pub
      - FORGEJO__repository.signing__SIGNING_NAME=${FORGEJO_SIGNING_NAME:-Danny Solivan}
      - FORGEJO__repository.signing__SIGNING_EMAIL=${FORGEJO_SIGNING_EMAIL:-dark@nightconcept.net}
      - FORGEJO__repository.signing__INITIAL_COMMIT=pubkey
      - FORGEJO__repository.signing__CRUD_ACTIONS=pubkey
      - FORGEJO__repository.signing__WIKI=pubkey
      - FORGEJO__repository.signing__MERGES=pubkey
    ports:
      - "2222:22"  # SSH port for git operations
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.forgejo.entrypoints=http"
      - "traefik.http.routers.forgejo.rule=Host(`forge.local.solivan.dev`) || Host(`forge.solivan.dev`)"
      - "traefik.http.middlewares.forgejo-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.forgejo.middlewares=forgejo-https-redirect"
      - "traefik.http.routers.forgejo-secure.entrypoints=https"
      - "traefik.http.routers.forgejo-secure.rule=Host(`forge.local.solivan.dev`) || Host(`forge.solivan.dev`)"
      - "traefik.http.routers.forgejo-secure.tls=true"
      - "traefik.http.routers.forgejo-secure.middlewares=crowdsec-bouncer@docker"
      - "traefik.http.routers.forgejo-secure.service=forgejo"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy:
    external: true