# Artifacts: Artifact Share (nightconcept/artifact-share, a fork of
# AlexDobrushskiy/artifact-share). One Go binary over SQLite. The image builds
# on Rinoa from the pinned `artifact-share` flake input. Traefik with the
# CrowdSec bouncer fronts it. ARTIFACTS_RULE is written by the NixOS module.
name: artifacts

services:
  artifacts:
    container_name: artifacts
    image: artifact-share:${ARTIFACTS_TAG?required}
    build:
      context: ${ARTIFACTS_SOURCE?required}
    restart: unless-stopped
    environment:
      ARTIFACT_SHARE_DATA_DIR: /data
      ARTIFACT_SHARE_PORT: "8436"
      ARTIFACT_SHARE_BASE_URL: ${ARTIFACTS_BASE_URL?required}
    volumes:
      - ${DATA_PATH?required}:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.artifacts.entrypoints=http"
      - "traefik.http.routers.artifacts.rule=${ARTIFACTS_RULE?required}"
      - "traefik.http.middlewares.artifacts-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.artifacts.middlewares=artifacts-https-redirect"
      - "traefik.http.routers.artifacts-secure.entrypoints=https"
      - "traefik.http.routers.artifacts-secure.rule=${ARTIFACTS_RULE?required}"
      - "traefik.http.routers.artifacts-secure.tls=true"
      - "traefik.http.routers.artifacts-secure.middlewares=crowdsec-bouncer@docker"
      - "traefik.http.routers.artifacts-secure.service=artifacts"
      - "traefik.http.services.artifacts.loadbalancer.server.port=8436"
      - "traefik.docker.network=proxy"

networks:
  proxy:
    external: true
