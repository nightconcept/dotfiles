# Artifacts: single-file HTML pages written by agents, served at /<id>.
# nginx does the serving and the PUT/DELETE; sweep.py (a systemd timer on the
# host) expires them. See readme.md.
name: artifacts

services:
  artifacts:
    container_name: artifacts
    image: nginxinc/nginx-unprivileged@${NGINX_DIGEST:-sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8}  # 1.28-alpine
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./auth.conf:/etc/nginx/auth.conf:ro
      - ${DATA_PATH:-./data}:/data
    networks:
      - artifacts
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  artifacts:
