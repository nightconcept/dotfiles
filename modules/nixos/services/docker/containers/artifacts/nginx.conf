# Artifact store: single-file HTML pages at /<id>, written through /_api/.
# Writes and the index need the bearer token in auth.conf (written by the
# NixOS module). sweep.py owns expiry. See readme.md.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    # Logs hold artifact ids (the read secret), so they stay on the host.
    access_log /dev/stdout;

    # The root filesystem is read-only; nginx's other temp paths are never used here.
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 5m;
    server_tokens off;

    # defines: map $http_authorization $writer { ... } (1 for the right token)
    include /etc/nginx/auth.conf;

    server {
        listen 8080;
        root /data;

        # An artifact is untrusted HTML with script. The sandbox gives the page
        # an opaque origin (no cookies or storage of solivan.dev), and the policy
        # allows no network calls, frames or external images, so it cannot send
        # data out. Scripts and styles may come from three public CDNs.
        add_header Content-Security-Policy "sandbox allow-scripts allow-popups; default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src data: https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src data: blob:; media-src data: blob:" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "private, max-age=300" always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Read: https://<host>/<id>
        location ~ "^/([0-9a-f]{16})$" {
            default_type text/html;
            try_files /a/$1.html =404;
        }

        # Index of live artifacts (ids are the read secret, so it needs the token).
        location = /_api/index.json {
            if ($writer = 0) { return 401; }
            default_type application/json;
            alias /data/index.json;
            add_header Cache-Control "no-store" always;
        }

        # Write: PUT or DELETE /_api/<id>.html and /_api/<id>.json
        location ~ "^/_api/([0-9a-f]{16})\.(html|json)$" {
            if ($writer = 0) { return 401; }
            alias /data/a/$1.$2;
            dav_methods PUT DELETE;
            create_full_put_path on;
            dav_access user:rw group:r all:r;
            add_header Cache-Control "no-store" always;
        }

        location / {
            return 404;
        }
    }
}
